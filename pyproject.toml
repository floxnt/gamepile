[project]
name = "gamepile"
version = "0.5.6"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "howlongtobeatpy>=1.0.21",
    "pywebview>=4.0",
    "PyGObject>=3.42; sys_platform == 'linux'",
    "keyring>=25.7.0",
    "platformdirs>=4.9.6",
]

[project.scripts]
gamepile = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
