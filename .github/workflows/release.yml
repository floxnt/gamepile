name: Release

# Tag-driven: pushing a tag matching v* (e.g. v0.5.0) triggers a real
# release build that uploads draft artifacts to a GitHub Release.
# workflow_dispatch lets us manually rebuild without tagging; those
# runs only upload to the Actions run page (no Release object touched).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write  # creating Releases requires write on contents

jobs:
  build:
    name: Build ${{ matrix.platform_label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_label: linux
          - os: windows-latest
            platform_label: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # Linux runner system deps for the Qt-backed build (v0.9.0+).
      # PySide6 installs from a manylinux wheel, but PyInstaller's
      # analysis-time import of PySide6.QtCore needs libGL/libEGL on the
      # runner. adwaita-icon-theme + librsvg2-bin support the AppImage
      # placeholder-icon pipeline (unchanged from v0.8.x).
      - name: Install system deps (Linux only)
        if: matrix.platform_label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libopengl0 \
            adwaita-icon-theme \
            librsvg2-bin

      - name: Install dependencies
        run: uv sync

      # pywebview 6.2.1's webview/platforms/winforms.py crashes at module-load
      # under .NET 8 coreclr because OpenFolderDialog's class body reflects
      # over .NET-Framework-internal types absent in .NET 8 WinForms. We carry
      # a vendored copy patched with smparkes' fix/dotnet8-coreclr branch
      # (commit a2bf0df4a4728b170cb02f1f1f698387fbaf0379) at
      # vendor/pywebview/winforms.py. This step copies it over the venv's
      # pywebview after uv sync and before PyInstaller scans, so the bundled
      # winforms.py is the patched one. Verify the source AND destination
      # SHA512s — every silent-success assumption in this arc has been
      # wrong; assert the bytes that landed.
      #
      # See SPEC_V5_DISTRIBUTION.md "pywebview winforms.py patch" for full
      # context. Pinned vendored-file SHA: a1c7c30…b92544c.
      - name: Apply pywebview winforms.py patch (Windows only)
        if: matrix.platform_label == 'windows'
        shell: pwsh
        run: |
          $src = "vendor\pywebview\winforms.py"
          $expected = "a1c7c3060c8f14352b552e987251e446957e64d0e49932fb09fd65f61b9cae43b93485277284bf8f391ab71dc9cff59e4636db8a6c88f5157385e30beb92544c"

          # Step 1: verify the vendored source bytes match the pinned hash.
          $srcActual = (Get-FileHash $src -Algorithm SHA512).Hash.ToLower()
          if ($srcActual -ne $expected) {
            Write-Host "Source SHA512 mismatch for $src"
            Write-Host "  expected: $expected"
            Write-Host "  actual:   $srcActual"
            exit 1
          }
          Write-Host "Source SHA512 verified: $src"

          # Step 2: locate the venv's webview/platforms/winforms.py and
          # overwrite it with the vendored patched version.
          $candidates = Get-ChildItem -Path .venv -Recurse -Filter "winforms.py" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'webview[\\/]platforms[\\/]winforms\.py$' }
          if ($candidates.Count -eq 0) {
            Write-Host "Could not locate webview/platforms/winforms.py in .venv — pywebview install layout may have changed."
            exit 1
          }
          if ($candidates.Count -gt 1) {
            Write-Host "Multiple winforms.py matches under .venv — ambiguous; investigate before shipping."
            $candidates | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }
          $dst = $candidates[0].FullName
          Copy-Item -Force $src $dst
          Write-Host "Copied vendored winforms.py to $dst"

          # Step 3: verify the destination bytes match the same pinned hash.
          # If Copy-Item silently no-op'd or the destination got truncated,
          # this fails the build instead of shipping a still-broken bundle.
          $dstActual = (Get-FileHash $dst -Algorithm SHA512).Hash.ToLower()
          if ($dstActual -ne $expected) {
            Write-Host "Destination SHA512 mismatch after copy"
            Write-Host "  file:     $dst"
            Write-Host "  expected: $expected"
            Write-Host "  actual:   $dstActual"
            exit 1
          }
          Write-Host "Destination SHA512 verified at venv layer."

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      # Self-contained .NET 8 runtime bundled into the Windows app.
      # Pinned to a specific 8.0.X patch with SHA512 from the official
      # Microsoft release-metadata feed
      # (builds.dotnet.microsoft.com/dotnet/release-metadata/8.0/releases.json).
      # When a security patch warrants bumping, update version + both URLs
      # + both SHA512 hashes together; deferred-housekeeping item tracked
      # in SPEC_V5_DISTRIBUTION.md.
      #
      # We bundle BOTH Microsoft.NETCore.App (base CLR + BCL) AND
      # Microsoft.WindowsDesktop.App (System.Windows.Forms, used by
      # pywebview's edgechromium backend to host the WebView2 control).
      # NETCore.App alone is insufficient — WinForms is not in it.
      #
      # The two zips share a directory layout that merges cleanly when
      # extracted into the same root (NETCore.App under
      # shared/Microsoft.NETCore.App/, WindowsDesktop.App under
      # shared/Microsoft.WindowsDesktop.App/ — no path collision).
      # pywebview 6.2.1 ships Microsoft.Web.WebView2.{Core,WinForms}.dll
      # built for .NETFramework 4.6.2. The WinForms.dll exposes a
      # `ContextMenu` property; that type was removed in .NET Core 3.0+
      # and replaced by `ContextMenuStrip`. Under the bundled .NET 8
      # coreclr runtime, pythonnet's reflection over the WebView2 class
      # hits the dead-type reference and throws TypeLoadException — the
      # v0.5.6 crash class.
      #
      # Fix: replace pywebview's bundled net462 WebView2 DLLs with the
      # netcoreapp3.0-TFM variants from the same Microsoft.Web.WebView2
      # NuGet package. Pin matches pywebview's own bundled binding
      # version (1.0.3856.49) — smallest behavioral delta from the
      # upstream-tested combination. Verified empirically: the
      # netcoreapp3.0 WinForms.dll only references ContextMenuStrip
      # (which exists in both .NET Framework and .NET 8), not
      # ContextMenu. Upstream context: pywebview issue #1803.
      #
      # SHA512 hash from sha512sum on the NuGet-served bytes. When the
      # NuGet API changes the served bytes for the same version (it
      # shouldn't — NuGet versions are supposed to be immutable — but
      # tracking it is the same discipline as the .NET runtime pin),
      # update URL + SHA together. Deferred-housekeeping item tracked
      # in SPEC_V5_DISTRIBUTION.md.
      - name: Download and verify WebView2 netcoreapp3.0 binding override (Windows only)
        if: matrix.platform_label == 'windows'
        shell: pwsh
        run: |
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/1.0.3856.49/microsoft.web.webview2.1.0.3856.49.nupkg"
          $expected = "ddbf23b637f0da274ddc10aeafdd26f05575cb985697c55adcad087c0adc0b34000f7e5df0b153b4cdf7c137808a75bf0d907f2469e82e0e2f6d7db6a117d4fb"
          Write-Host "Downloading Microsoft.Web.WebView2 1.0.3856.49 NuGet package..."
          Invoke-WebRequest -Uri $url -OutFile webview2.nupkg -UseBasicParsing
          $actual = (Get-FileHash webview2.nupkg -Algorithm SHA512).Hash.ToLower()
          if ($actual -ne $expected) {
            Write-Host "SHA512 mismatch for WebView2 NuGet package"
            Write-Host "  expected: $expected"
            Write-Host "  actual:   $actual"
            exit 1
          }
          Write-Host "  SHA512 verified."
          New-Item -ItemType Directory -Force -Path webview2_override | Out-Null
          # NuGet packages are zip files; extract the two netcoreapp3.0
          # DLLs we need. lib_manual/netcoreapp3.0/ is the package's
          # .NET Core target directory.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("$pwd\webview2.nupkg")
          foreach ($entry in $zip.Entries) {
            if ($entry.FullName -eq "lib_manual/netcoreapp3.0/Microsoft.Web.WebView2.Core.dll" -or `
                $entry.FullName -eq "lib_manual/netcoreapp3.0/Microsoft.Web.WebView2.WinForms.dll") {
              $dst = "$pwd\webview2_override\" + [System.IO.Path]::GetFileName($entry.FullName)
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $dst, $true)
              Write-Host "  extracted: $dst"
            }
          }
          $zip.Dispose()
          Remove-Item webview2.nupkg
          Get-ChildItem webview2_override | Format-Table Name, Length

      - name: Download and verify bundled .NET 8 runtime (Windows only)
        if: matrix.platform_label == 'windows'
        shell: pwsh
        run: |
          $runtimes = @(
            @{
              Url  = "https://builds.dotnet.microsoft.com/dotnet/Runtime/8.0.27/dotnet-runtime-8.0.27-win-x64.zip"
              Sha  = "e31528b5452afdec4cdf78fb073e8693ed0c24a14f5b69065e7018f89eefc38e52fcfd4eed8255b5d58867aa850f66790fead5b66f0fab13a72bebf098e98937"
              Name = "dotnet-runtime-8.0.27-win-x64.zip"
            },
            @{
              Url  = "https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/8.0.27/windowsdesktop-runtime-8.0.27-win-x64.zip"
              Sha  = "c56ef39aca978a39be22e9377518787acaf0bbebf7b019415e84ed8558e8a06000c95f34863911ad5bfe3a87462bc6b67aa01d256edac03a3c55c90def86da17"
              Name = "windowsdesktop-runtime-8.0.27-win-x64.zip"
            }
          )
          New-Item -ItemType Directory -Force -Path dotnet\runtime | Out-Null
          foreach ($rt in $runtimes) {
            Write-Host "Downloading $($rt.Name)..."
            Invoke-WebRequest -Uri $rt.Url -OutFile $rt.Name -UseBasicParsing
            $actual = (Get-FileHash $rt.Name -Algorithm SHA512).Hash.ToLower()
            if ($actual -ne $rt.Sha) {
              Write-Host "SHA512 mismatch for $($rt.Name)"
              Write-Host "  expected: $($rt.Sha)"
              Write-Host "  actual:   $actual"
              exit 1
            }
            Write-Host "  SHA512 verified."
            Expand-Archive -Path $rt.Name -DestinationPath dotnet\runtime -Force
            Remove-Item $rt.Name
          }
          Write-Host "Bundled .NET 8.0.27 runtime ready in dotnet\runtime\"
          Get-ChildItem dotnet\runtime\shared | Select-Object Name

      # Tests run on Linux only (full suite); Windows skips ahead to the
      # build + bundle-smoke-test path. Rationale: the credentials /
      # paths / hook_metrics / dashboard suites are platform-agnostic
      # business logic, and running them once is enough signal.
      - name: Run test suite (Linux only)
        if: matrix.platform_label == 'linux'
        run: uv run python tests/run_tests.py

      - name: Build PyInstaller bundle
        run: uv run pyinstaller gamepile.spec --noconfirm

      # Post-build WebView2 binding override (Windows only). The
      # gamepile.spec filter that removes pywebview's net462 binding
      # DLLs from collect_all('webview') output is necessary but not
      # sufficient: pywebview's PyInstaller hook
      # (webview/__pyinstaller/hook-webview.py) is re-invoked
      # independently during PyInstaller's Analysis() phase via
      # collect_data_files + collect_dynamic_libs, re-adding the
      # net462 DLLs after the spec-level filter ran. v0.5.7 shipped
      # broken for exactly this reason.
      #
      # The deterministic fix is filesystem-level last-write-wins:
      # after PyInstaller produces dist/gamepile/, overwrite the two
      # binding DLLs at their final bundle location with the
      # netcoreapp3.0 variants. pywebview's interop_dll_path resolves
      # to <_MEIPASS>/webview/lib/ in frozen mode (verified against
      # webview/util.py:480-497), which translates to
      # dist/gamepile/_internal/webview/lib/ in the onedir bundle.
      #
      # SHA512-verify after the copy. Every silent-success assumption
      # in this arc has been wrong; we assert the bytes that actually
      # landed in the bundle match the netcoreapp3.0 source. If a
      # future PyInstaller change moves the destination path, the
      # copy silently no-ops, or anything else interferes, the build
      # fails loudly here rather than shipping a silently-broken
      # bundle.
      - name: Apply WebView2 binding override to built bundle (Windows only)
        if: matrix.platform_label == 'windows'
        shell: pwsh
        run: |
          $dst = "dist\gamepile\_internal\webview\lib"
          if (-not (Test-Path $dst)) {
            Write-Host "Expected destination $dst does not exist — pywebview layout in bundle may have changed; investigate before shipping."
            exit 1
          }
          Copy-Item -Force "webview2_override\Microsoft.Web.WebView2.Core.dll"    "$dst\Microsoft.Web.WebView2.Core.dll"
          Copy-Item -Force "webview2_override\Microsoft.Web.WebView2.WinForms.dll" "$dst\Microsoft.Web.WebView2.WinForms.dll"
          Write-Host "Copied netcoreapp3.0 binding DLLs into $dst"

          # Verify bytes-now-in-bundle match the netcoreapp3.0 source.
          # SHA512 hashes computed at v0.5.8 commit time from the
          # NuGet 1.0.3856.49 lib_manual/netcoreapp3.0/ files. If the
          # pinned NuGet URL stops serving these exact bytes, the
          # earlier "Download and verify WebView2 netcoreapp3.0
          # binding override" step's package-level SHA check fails
          # first; this is the bundle-layer cross-check.
          $checks = @(
            @{
              File = "$dst\Microsoft.Web.WebView2.Core.dll"
              Sha  = "6ba5910c6e1ca0124ec597fc6b64c858c260663ea4bd50552dd6df43e3198a5e75a2f1df972fddf732857292b66dc6f2fd874f966587e611c01fe11244d0114a"
            },
            @{
              File = "$dst\Microsoft.Web.WebView2.WinForms.dll"
              Sha  = "e30015047e7ac0e2e93e43fdcb205cf31fc184bd7ebbeb9fabaa64ea2027d06c93de3aa69b5cee9cef256b2b0d832e808aeead66a0a5e84ab3b86a4df6b7e1c6"
            }
          )
          foreach ($c in $checks) {
            $actual = (Get-FileHash $c.File -Algorithm SHA512).Hash.ToLower()
            if ($actual -ne $c.Sha) {
              Write-Host "SHA512 mismatch after override copy"
              Write-Host "  file:     $($c.File)"
              Write-Host "  expected: $($c.Sha)"
              Write-Host "  actual:   $actual"
              exit 1
            }
            Write-Host "  $([System.IO.Path]::GetFileName($c.File)): SHA512 verified."
          }
          Write-Host "WebView2 binding override verified at bundle layer."

      # Smoke-test the Windows bundle: the built executable must
      # start uvicorn, respond on /healthz, and exit cleanly. Catches
      # missing-dependency / import-error regressions that wouldn't
      # surface in dev. 30s timeout absorbs slow cold-start variance
      # on windows-latest runners.
      #
      # We use Start-Process -Wait, not the `&` call operator: the
      # PyInstaller bundle is built with console=False (correct —
      # gamepile is a pywebview GUI app), which produces a GUI-subsystem
      # EXE on Windows. PowerShell's `&` does NOT block for GUI-subsystem
      # processes — it returns immediately with $LASTEXITCODE unset, so
      # the check races the EXE and reads a null exit code (verified in
      # the v0.5.2 run log: the EXE's "ok" print landed ~1.3s AFTER the
      # smoke-test step had already failed). Start-Process -Wait blocks
      # until the process exits regardless of subsystem; -PassThru gives
      # us the Process object whose .ExitCode is the reliable signal.
      # -NoNewWindow keeps any incidental sub-process output flowing
      # through the captured pwsh stream instead of a transient console.
      - name: Smoke-test bundle (Windows only)
        if: matrix.platform_label == 'windows'
        shell: pwsh
        run: |
          # Two-stage smoke test. --healthz-only covers the uvicorn/FastAPI
          # half (the bundle imports, boots, serves /healthz). It does NOT
          # touch pywebview — by design — so it doesn't fire `import clr`
          # and missed v0.5.3/v0.5.4's missing-pythonnet-companions bug.
          # --check-windows-runtime covers exactly that gap: it forces
          # `import clr` (pythonnet → clr_loader → netfx) and imports the
          # edgechromium backend module. No window opens, no display
          # required — only the .NET loader chain is exercised. If the
          # bundle is missing Python.Runtime.dll.config / runtimeconfig.json
          # / clr_loader's clr.dll shim, this step fails fast at build time
          # instead of at end-user launch.
          $hz = Start-Process -FilePath ".\dist\gamepile\gamepile.exe" `
              -ArgumentList "--healthz-only" -Wait -PassThru -NoNewWindow
          if ($hz.ExitCode -ne 0) {
            Write-Host "--healthz-only FAILED — exit code $($hz.ExitCode)"
            exit 1
          }
          Write-Host "--healthz-only PASSED"

          $rt = Start-Process -FilePath ".\dist\gamepile\gamepile.exe" `
              -ArgumentList "--check-windows-runtime" -Wait -PassThru -NoNewWindow
          if ($rt.ExitCode -ne 0) {
            Write-Host "--check-windows-runtime FAILED — exit code $($rt.ExitCode)"
            exit 1
          }
          Write-Host "--check-windows-runtime PASSED"
          Write-Host "Smoke test PASSED (both stages)"
          exit 0

      # README.bundled.md ships inside each archive as README.md — gives
      # users the install / first-run / troubleshooting docs without
      # needing to visit GitHub.
      - name: Stage bundled README (Linux)
        if: matrix.platform_label == 'linux'
        run: cp README.bundled.md dist/gamepile/README.md

      - name: Stage bundled README (Windows)
        if: matrix.platform_label == 'windows'
        shell: pwsh
        run: Copy-Item README.bundled.md dist\gamepile\README.md

      # Download + SHA512-verify linuxdeploy. linuxdeploy's output is the
      # AppImage payload that lands on end-user machines, so it falls
      # under the load-bearing SHA-pinning discipline established at
      # v0.5.6. See SPEC_V5_DISTRIBUTION.md "SHA-pinning discipline".
      #
      # v0.9.0+: linuxdeploy-plugin-gtk is no longer needed — the Qt
      # backend's PySide6 ships self-contained Qt binaries bundled by
      # PyInstaller, not by linuxdeploy plugins. linuxdeploy is still
      # needed for AppDir → AppImage packaging (AppRun generation +
      # squashfs compression).
      #
      # Pin source: github.com/linuxdeploy/linuxdeploy continuous release.
      # Continuous-only — no semver tags upstream. SHA512 pinned at
      # target_commitish a9f929ff0e32d5c4bcb7b5c380adff4802f918ba
      # (refreshed 2026-05-12). Deferred housekeeping: re-pin when
      # upstream issues a notable update.
      - name: Download and verify linuxdeploy (Linux only)
        if: matrix.platform_label == 'linux'
        run: |
          mkdir -p tools
          cd tools

          LINUXDEPLOY_URL="https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          LINUXDEPLOY_SHA512="000097de845868905595a58c5532387155e493ee76dd5134f143b6d028bbebb62188b99c9a5836c387f3038604167bf71ba4318bfd80d204a0c030bcc9892f8f"

          echo "Downloading linuxdeploy..."
          curl -fsSL -o linuxdeploy-x86_64.AppImage "$LINUXDEPLOY_URL"
          actual=$(sha512sum linuxdeploy-x86_64.AppImage | cut -d' ' -f1)
          if [[ "$actual" != "$LINUXDEPLOY_SHA512" ]]; then
            echo "SHA512 mismatch for linuxdeploy-x86_64.AppImage"
            echo "  expected: $LINUXDEPLOY_SHA512"
            echo "  actual:   $actual"
            exit 1
          fi
          echo "  SHA512 verified."
          chmod +x linuxdeploy-x86_64.AppImage

          ls -la

      # Build the AppImage (v0.9.0+, Qt-backed). PySide6 ships
      # self-contained Qt + QtWebEngine binaries inside the wheel;
      # PyInstaller's PySide6 hook bundles them into _internal/.
      # linuxdeploy packages the PyInstaller output into an AppImage
      # in a single phase (no plugins, no hooks, no --library).
      #
      # v0.8.x used a 3-phase linuxdeploy invocation with plugin-gtk,
      # apprun-hooks for LD_LIBRARY_PATH/GI_TYPELIB_PATH, and --library
      # for WebKit2GTK transitive deps. All of that is gone — the Qt
      # model is structurally self-contained. See SPEC_V6_LINUX_QT.md
      # for the architectural decision record.
      - name: Build AppImage (Linux only)
        if: matrix.platform_label == 'linux'
        run: |
          set -euo pipefail

          APPDIR="AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          cp -r dist/gamepile/* "$APPDIR/usr/bin/"
          cp installer/linux/gamepile.desktop "$APPDIR/usr/share/applications/gamepile.desktop"

          # Stock placeholder icon (same probe as v0.8.x — unchanged).
          ICON_DST="$APPDIR/usr/share/icons/hicolor/256x256/apps/gamepile.png"
          PNG_CANDIDATES=(
            /usr/share/icons/Adwaita/256x256/legacy/applications-games.png
            /usr/share/icons/Adwaita/256x256/apps/applications-games.png
          )
          SVG_CANDIDATES=(
            /usr/share/icons/Adwaita/scalable/categories/applications-games.svg
            /usr/share/icons/Adwaita/scalable/legacy/applications-games.svg
            /usr/share/icons/Adwaita/symbolic/categories/applications-games-symbolic.svg
            /usr/share/icons/Adwaita/symbolic/legacy/applications-games-symbolic.svg
          )

          FOUND_ICON=""
          for ICON in "${PNG_CANDIDATES[@]}"; do
            if [[ -f "$ICON" ]]; then
              cp "$ICON" "$ICON_DST"
              FOUND_ICON="$ICON (PNG, copied as-is)"
              break
            fi
          done
          if [[ -z "$FOUND_ICON" ]]; then
            for SVG in "${SVG_CANDIDATES[@]}"; do
              if [[ -f "$SVG" ]]; then
                rsvg-convert -w 256 -h 256 "$SVG" -o "$ICON_DST"
                FOUND_ICON="$SVG (rendered to 256x256 PNG via rsvg-convert)"
                break
              fi
            done
          fi
          if [[ -z "$FOUND_ICON" ]]; then
            echo "No stock Adwaita applications-games icon found at any expected path."
            echo "adwaita-icon-theme layout may have shifted on this Ubuntu runner."
            echo "Available Adwaita icons matching applications-games:"
            find /usr/share/icons/Adwaita -name 'applications-games*' 2>/dev/null || echo "  (none)"
            exit 1
          fi
          echo "Placeholder icon source: $FOUND_ICON"

          # Single-phase linuxdeploy: no plugins, no hooks. PySide6's Qt
          # is fully self-contained inside _internal/ (PyInstaller handles
          # the bundling via its PySide6 hook). linuxdeploy generates
          # AppRun + squashfs packaging.
          export PATH="$PWD/tools:$PATH"
          ./tools/linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir "$APPDIR" \
            --desktop-file "$APPDIR/usr/share/applications/gamepile.desktop" \
            --icon-file "$ICON_DST" \
            --executable "$APPDIR/usr/bin/gamepile" \
            --output appimage

          APPIMAGE_BUILT=$(ls -1 *.AppImage 2>/dev/null | grep -v 'linuxdeploy' | head -1)
          if [[ -z "$APPIMAGE_BUILT" ]]; then
            echo "No AppImage produced by linuxdeploy — investigate linuxdeploy stdout above."
            ls -la
            exit 1
          fi

          APPIMAGE_FINAL="gamepile-${{ github.ref_name }}-linux-x64.AppImage"
          mv "$APPIMAGE_BUILT" "$APPIMAGE_FINAL"
          chmod +x "$APPIMAGE_FINAL"

          # Plausibility floor. PySide6 + QtWebEngine bundle is ~234 MB
          # compressed (spike B measurement). Floor at 100 MB so a build
          # that silently drops PySide6/QtWebEngine fails fast. Calibrated
          # from spike B's first successful build.
          size=$(stat -c%s "$APPIMAGE_FINAL")
          echo "Built $APPIMAGE_FINAL ($size bytes)"
          if [[ "$size" -lt 100000000 ]]; then
            echo "AppImage size $size bytes is below the 100 MB plausibility floor — PySide6/QtWebEngine payload may have been silently dropped."
            exit 1
          fi

      # Install Inno Setup compiler on the Windows runner. Chocolatey is
      # pre-installed on windows-latest and the innosetup package is stable;
      # two-line install, no ceremony required.
      #
      # We deliberately do NOT SHA-pin the Inno Setup binary. The pinning
      # discipline in this workflow (for .NET 8 runtime, WebView2 binding,
      # vendored pywebview winforms.py) applies to binaries that ship TO
      # USERS inside the bundle — if the pinned bytes change, end-user
      # machines get different code. ISCC.exe runs only on the CI host and
      # never reaches the user; pinning it would add maintenance burden
      # without protecting any user-visible output. See
      # SPEC_V5_DISTRIBUTION.md "SHA-pinning discipline" for the principle.
      - name: Install Inno Setup (Windows only)
        if: matrix.platform_label == 'windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # Verify ISCC is on PATH so the compile step can find it.
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue)
          if (-not $iscc) {
            Write-Host "ISCC.exe not found on PATH after chocolatey install."
            exit 1
          }
          Write-Host "ISCC located at: $($iscc.Source)"
          & iscc.exe /? | Select-Object -First 3

      # Compile the Inno Setup installer against the PyInstaller --onedir
      # output. Version sourced from the git tag (github.ref_name = vX.Y.Z),
      # stripped of the 'v' prefix so the installer's AppVersion / Add/Remove
      # Programs entry shows the bare semver (e.g. "0.8.0", not "v0.8.0") per
      # Windows convention. Output filename uses the v-prefix per the project
      # release-artifact naming convention (gamepile-setup-v0.8.0.exe).
      - name: Build Inno Setup installer (Windows only)
        if: matrix.platform_label == 'windows'
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          Write-Host "Compiling installer for AppVersion=$version"
          & iscc.exe "/DAppVersion=$version" installer\gamepile.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ISCC compile failed — exit $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          $expectedExe = "gamepile-setup-${{ github.ref_name }}.exe"
          if (-not (Test-Path $expectedExe)) {
            Write-Host "Expected installer $expectedExe not present after compile."
            Get-ChildItem -Filter "gamepile-setup-*.exe" | Format-Table Name, Length
            exit 1
          }
          $size = (Get-Item $expectedExe).Length
          Write-Host "Built $expectedExe ($size bytes)"
          # Plausibility floor: empirically the v0.8.0 installer with the
          # full --onedir payload (Python + FastAPI + .NET 8 + WebView2 +
          # vendored bits) compresses under lzma2/ultra to ~66 MB. Floor
          # at 50 MB so a build that silently drops a major sub-bundle
          # (e.g. the bundled .NET 8 runtime — ~30 MB compressed alone)
          # fails fast here rather than shipping a missing-dependency
          # installer. Recalibrate this floor only with measured data,
          # not assumed bundle sizes.
          if ($size -lt 50000000) {
            Write-Host "Installer size $size bytes is below the 50 MB plausibility floor — payload may have been silently dropped."
            exit 1
          }

      # Tag pushes publish a Release directly. The earlier design routed
      # tag pushes to a draft Release for manual promotion, on the theory
      # that the author should control when releases go public. In
      # practice the manual-promote step was never taken, so "user
      # controls when releases go public" became "releases never go
      # public" — strictly worse for a friend-distribution project.
      # Direct publish wins.
      # Manual workflow_dispatch runs still upload to the Actions run
      # page only — keeps the Releases list clean during iteration.
      #
      # Windows artifact: gamepile-setup-vX.Y.Z.exe (Inno installer,
      # v0.8.0+). The raw .zip archive was retired in v0.8.0.
      # Linux artifact: gamepile-vX.Y.Z-linux-x64.AppImage (v0.8.2+).
      # The raw .tar.gz was retired in v0.8.2 — see SPEC_V5_DISTRIBUTION.md
      # "AppImage (Linux, v0.8.2+)" for the architecture and the host-
      # distribution-dependency-gap rationale.
      #
      # prerelease: true (v0.8.0+) — every tag-push release lands as
      # prerelease, with an awaiting-manual-validation body note. The
      # author promotes to canonical by editing the Release on GitHub
      # after the manual hardware gate(s) clear (see
      # SPEC_V5_DISTRIBUTION.md "Release acceptance is the manual
      # install/launch/upgrade/uninstall test" for the Windows gate,
      # and "Release acceptance for AppImage" for the Linux gate). This
      # makes the manual-gate-required protocol structural rather than
      # memory-of-process — friends looking at the Releases page see
      # the prerelease badge and the body note; they know to wait for
      # the canonical promotion.
      - name: Publish Release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: true
          files: |
            gamepile-${{ github.ref_name }}-linux-x64.AppImage
            gamepile-setup-${{ github.ref_name }}.exe
          fail_on_unmatched_files: false
          generate_release_notes: true
          body: |
            **Prerelease — awaiting manual hardware validation.**

            This release builds the Windows installer and the Linux
            AppImage in CI, but the manual install / launch / upgrade /
            uninstall flows on real consumer hardware have not yet been
            confirmed. The validation gates are:

            - **Windows**: install / launch / upgrade-preserves-DB /
              uninstall-doesn't-touch-data on a real Windows 11 machine.
            - **Linux**: the AppImage launches on a fresh Linux host
              (CachyOS or equivalent) WITHOUT GTK 3 / pygobject / Cairo
              system packages preinstalled — the load-bearing AppImage
              property is "self-contained, no host system deps."

            Once the author runs the gates and confirms they pass, this
            prerelease tag will be promoted to canonical. Until then,
            please use the previous canonical (non-prerelease) Release.

            See `SPEC_V5_DISTRIBUTION.md` "Release acceptance is the
            manual install/launch/upgrade/uninstall test" (Windows) and
            "Release acceptance for AppImage" (Linux) for the gate
            definitions.

      - name: Upload bundle as workflow artifact (dispatch runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gamepile-${{ matrix.platform_label }}-${{ github.sha }}
          path: |
            gamepile-*-linux-x64.AppImage
            gamepile-setup-*.exe
          if-no-files-found: ignore
          retention-days: 14
