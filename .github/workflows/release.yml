name: Release

# Tag-driven: pushing a tag matching v* (e.g. v0.5.0) triggers a real
# release build that uploads draft artifacts to a GitHub Release.
# workflow_dispatch lets us manually rebuild without tagging; those
# runs only upload to the Actions run page (no Release object touched).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write  # creating Releases requires write on contents

jobs:
  build:
    name: Build ${{ matrix.platform_label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_label: linux
            archive_ext: tar.gz
          - os: windows-latest
            platform_label: windows
            archive_ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # Linux runner needs the GTK + WebKit system libraries before
      # PyGObject can import; without them, pyinstaller produces a
      # bundle that crashes at runtime trying to load gi.repository.
      # webkit2gtk-4.1 is the rendering engine pywebview's gtk backend uses.
      # libcairo2-dev is required for the pycairo source build that uv
      # falls back to when no matching wheel is available; libcairo2
      # itself (runtime) is already pulled in transitively by webkit2gtk.
      # libgirepository-2.0-dev is required for the pygobject 3.56 source
      # build (pygobject 3.51+ switched its build namespace to the 2.0
      # girepository); libgirepository1.0-dev stays for now — they install
      # cleanly side-by-side and pruning 1.0 is deferred to housekeeping.
      - name: Install GTK runtime (Linux only)
        if: matrix.platform_label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-0 \
            libgirepository1.0-dev \
            libgirepository-2.0-dev \
            libcairo2-dev \
            gir1.2-webkit2-4.1 \
            gir1.2-gtk-3.0 \
            python3-gi

      - name: Install dependencies
        run: uv sync

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      # Self-contained .NET 8 runtime bundled into the Windows app.
      # Pinned to a specific 8.0.X patch with SHA512 from the official
      # Microsoft release-metadata feed
      # (builds.dotnet.microsoft.com/dotnet/release-metadata/8.0/releases.json).
      # When a security patch warrants bumping, update version + both URLs
      # + both SHA512 hashes together; deferred-housekeeping item tracked
      # in SPEC_V5_DISTRIBUTION.md.
      #
      # We bundle BOTH Microsoft.NETCore.App (base CLR + BCL) AND
      # Microsoft.WindowsDesktop.App (System.Windows.Forms, used by
      # pywebview's edgechromium backend to host the WebView2 control).
      # NETCore.App alone is insufficient — WinForms is not in it.
      #
      # The two zips share a directory layout that merges cleanly when
      # extracted into the same root (NETCore.App under
      # shared/Microsoft.NETCore.App/, WindowsDesktop.App under
      # shared/Microsoft.WindowsDesktop.App/ — no path collision).
      # pywebview 6.2.1 ships Microsoft.Web.WebView2.{Core,WinForms}.dll
      # built for .NETFramework 4.6.2. The WinForms.dll exposes a
      # `ContextMenu` property; that type was removed in .NET Core 3.0+
      # and replaced by `ContextMenuStrip`. Under the bundled .NET 8
      # coreclr runtime, pythonnet's reflection over the WebView2 class
      # hits the dead-type reference and throws TypeLoadException — the
      # v0.5.6 crash class.
      #
      # Fix: replace pywebview's bundled net462 WebView2 DLLs with the
      # netcoreapp3.0-TFM variants from the same Microsoft.Web.WebView2
      # NuGet package. Pin matches pywebview's own bundled binding
      # version (1.0.3856.49) — smallest behavioral delta from the
      # upstream-tested combination. Verified empirically: the
      # netcoreapp3.0 WinForms.dll only references ContextMenuStrip
      # (which exists in both .NET Framework and .NET 8), not
      # ContextMenu. Upstream context: pywebview issue #1803.
      #
      # SHA512 hash from sha512sum on the NuGet-served bytes. When the
      # NuGet API changes the served bytes for the same version (it
      # shouldn't — NuGet versions are supposed to be immutable — but
      # tracking it is the same discipline as the .NET runtime pin),
      # update URL + SHA together. Deferred-housekeeping item tracked
      # in SPEC_V5_DISTRIBUTION.md.
      - name: Download and verify WebView2 netcoreapp3.0 binding override (Windows only)
        if: matrix.platform_label == 'windows'
        shell: pwsh
        run: |
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/1.0.3856.49/microsoft.web.webview2.1.0.3856.49.nupkg"
          $expected = "ddbf23b637f0da274ddc10aeafdd26f05575cb985697c55adcad087c0adc0b34000f7e5df0b153b4cdf7c137808a75bf0d907f2469e82e0e2f6d7db6a117d4fb"
          Write-Host "Downloading Microsoft.Web.WebView2 1.0.3856.49 NuGet package..."
          Invoke-WebRequest -Uri $url -OutFile webview2.nupkg -UseBasicParsing
          $actual = (Get-FileHash webview2.nupkg -Algorithm SHA512).Hash.ToLower()
          if ($actual -ne $expected) {
            Write-Host "SHA512 mismatch for WebView2 NuGet package"
            Write-Host "  expected: $expected"
            Write-Host "  actual:   $actual"
            exit 1
          }
          Write-Host "  SHA512 verified."
          New-Item -ItemType Directory -Force -Path webview2_override | Out-Null
          # NuGet packages are zip files; extract the two netcoreapp3.0
          # DLLs we need. lib_manual/netcoreapp3.0/ is the package's
          # .NET Core target directory.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("$pwd\webview2.nupkg")
          foreach ($entry in $zip.Entries) {
            if ($entry.FullName -eq "lib_manual/netcoreapp3.0/Microsoft.Web.WebView2.Core.dll" -or `
                $entry.FullName -eq "lib_manual/netcoreapp3.0/Microsoft.Web.WebView2.WinForms.dll") {
              $dst = "$pwd\webview2_override\" + [System.IO.Path]::GetFileName($entry.FullName)
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $dst, $true)
              Write-Host "  extracted: $dst"
            }
          }
          $zip.Dispose()
          Remove-Item webview2.nupkg
          Get-ChildItem webview2_override | Format-Table Name, Length

      - name: Download and verify bundled .NET 8 runtime (Windows only)
        if: matrix.platform_label == 'windows'
        shell: pwsh
        run: |
          $runtimes = @(
            @{
              Url  = "https://builds.dotnet.microsoft.com/dotnet/Runtime/8.0.27/dotnet-runtime-8.0.27-win-x64.zip"
              Sha  = "e31528b5452afdec4cdf78fb073e8693ed0c24a14f5b69065e7018f89eefc38e52fcfd4eed8255b5d58867aa850f66790fead5b66f0fab13a72bebf098e98937"
              Name = "dotnet-runtime-8.0.27-win-x64.zip"
            },
            @{
              Url  = "https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/8.0.27/windowsdesktop-runtime-8.0.27-win-x64.zip"
              Sha  = "c56ef39aca978a39be22e9377518787acaf0bbebf7b019415e84ed8558e8a06000c95f34863911ad5bfe3a87462bc6b67aa01d256edac03a3c55c90def86da17"
              Name = "windowsdesktop-runtime-8.0.27-win-x64.zip"
            }
          )
          New-Item -ItemType Directory -Force -Path dotnet\runtime | Out-Null
          foreach ($rt in $runtimes) {
            Write-Host "Downloading $($rt.Name)..."
            Invoke-WebRequest -Uri $rt.Url -OutFile $rt.Name -UseBasicParsing
            $actual = (Get-FileHash $rt.Name -Algorithm SHA512).Hash.ToLower()
            if ($actual -ne $rt.Sha) {
              Write-Host "SHA512 mismatch for $($rt.Name)"
              Write-Host "  expected: $($rt.Sha)"
              Write-Host "  actual:   $actual"
              exit 1
            }
            Write-Host "  SHA512 verified."
            Expand-Archive -Path $rt.Name -DestinationPath dotnet\runtime -Force
            Remove-Item $rt.Name
          }
          Write-Host "Bundled .NET 8.0.27 runtime ready in dotnet\runtime\"
          Get-ChildItem dotnet\runtime\shared | Select-Object Name

      # Tests run on Linux only (full suite); Windows skips ahead to the
      # build + bundle-smoke-test path. Rationale: the credentials /
      # paths / hook_metrics / dashboard suites are platform-agnostic
      # business logic, and running them once is enough signal.
      - name: Run test suite (Linux only)
        if: matrix.platform_label == 'linux'
        run: uv run python tests/run_tests.py

      - name: Build PyInstaller bundle
        run: uv run pyinstaller gamepile.spec --noconfirm

      # Post-build WebView2 binding override (Windows only). The
      # gamepile.spec filter that removes pywebview's net462 binding
      # DLLs from collect_all('webview') output is necessary but not
      # sufficient: pywebview's PyInstaller hook
      # (webview/__pyinstaller/hook-webview.py) is re-invoked
      # independently during PyInstaller's Analysis() phase via
      # collect_data_files + collect_dynamic_libs, re-adding the
      # net462 DLLs after the spec-level filter ran. v0.5.7 shipped
      # broken for exactly this reason.
      #
      # The deterministic fix is filesystem-level last-write-wins:
      # after PyInstaller produces dist/gamepile/, overwrite the two
      # binding DLLs at their final bundle location with the
      # netcoreapp3.0 variants. pywebview's interop_dll_path resolves
      # to <_MEIPASS>/webview/lib/ in frozen mode (verified against
      # webview/util.py:480-497), which translates to
      # dist/gamepile/_internal/webview/lib/ in the onedir bundle.
      #
      # SHA512-verify after the copy. Every silent-success assumption
      # in this arc has been wrong; we assert the bytes that actually
      # landed in the bundle match the netcoreapp3.0 source. If a
      # future PyInstaller change moves the destination path, the
      # copy silently no-ops, or anything else interferes, the build
      # fails loudly here rather than shipping a silently-broken
      # bundle.
      - name: Apply WebView2 binding override to built bundle (Windows only)
        if: matrix.platform_label == 'windows'
        shell: pwsh
        run: |
          $dst = "dist\gamepile\_internal\webview\lib"
          if (-not (Test-Path $dst)) {
            Write-Host "Expected destination $dst does not exist — pywebview layout in bundle may have changed; investigate before shipping."
            exit 1
          }
          Copy-Item -Force "webview2_override\Microsoft.Web.WebView2.Core.dll"    "$dst\Microsoft.Web.WebView2.Core.dll"
          Copy-Item -Force "webview2_override\Microsoft.Web.WebView2.WinForms.dll" "$dst\Microsoft.Web.WebView2.WinForms.dll"
          Write-Host "Copied netcoreapp3.0 binding DLLs into $dst"

          # Verify bytes-now-in-bundle match the netcoreapp3.0 source.
          # SHA512 hashes computed at v0.5.8 commit time from the
          # NuGet 1.0.3856.49 lib_manual/netcoreapp3.0/ files. If the
          # pinned NuGet URL stops serving these exact bytes, the
          # earlier "Download and verify WebView2 netcoreapp3.0
          # binding override" step's package-level SHA check fails
          # first; this is the bundle-layer cross-check.
          $checks = @(
            @{
              File = "$dst\Microsoft.Web.WebView2.Core.dll"
              Sha  = "6ba5910c6e1ca0124ec597fc6b64c858c260663ea4bd50552dd6df43e3198a5e75a2f1df972fddf732857292b66dc6f2fd874f966587e611c01fe11244d0114a"
            },
            @{
              File = "$dst\Microsoft.Web.WebView2.WinForms.dll"
              Sha  = "e30015047e7ac0e2e93e43fdcb205cf31fc184bd7ebbeb9fabaa64ea2027d06c93de3aa69b5cee9cef256b2b0d832e808aeead66a0a5e84ab3b86a4df6b7e1c6"
            }
          )
          foreach ($c in $checks) {
            $actual = (Get-FileHash $c.File -Algorithm SHA512).Hash.ToLower()
            if ($actual -ne $c.Sha) {
              Write-Host "SHA512 mismatch after override copy"
              Write-Host "  file:     $($c.File)"
              Write-Host "  expected: $($c.Sha)"
              Write-Host "  actual:   $actual"
              exit 1
            }
            Write-Host "  $([System.IO.Path]::GetFileName($c.File)): SHA512 verified."
          }
          Write-Host "WebView2 binding override verified at bundle layer."

      # Smoke-test the Windows bundle: the built executable must
      # start uvicorn, respond on /healthz, and exit cleanly. Catches
      # missing-dependency / import-error regressions that wouldn't
      # surface in dev. 30s timeout absorbs slow cold-start variance
      # on windows-latest runners.
      #
      # We use Start-Process -Wait, not the `&` call operator: the
      # PyInstaller bundle is built with console=False (correct —
      # gamepile is a pywebview GUI app), which produces a GUI-subsystem
      # EXE on Windows. PowerShell's `&` does NOT block for GUI-subsystem
      # processes — it returns immediately with $LASTEXITCODE unset, so
      # the check races the EXE and reads a null exit code (verified in
      # the v0.5.2 run log: the EXE's "ok" print landed ~1.3s AFTER the
      # smoke-test step had already failed). Start-Process -Wait blocks
      # until the process exits regardless of subsystem; -PassThru gives
      # us the Process object whose .ExitCode is the reliable signal.
      # -NoNewWindow keeps any incidental sub-process output flowing
      # through the captured pwsh stream instead of a transient console.
      - name: Smoke-test bundle (Windows only)
        if: matrix.platform_label == 'windows'
        shell: pwsh
        run: |
          # Two-stage smoke test. --healthz-only covers the uvicorn/FastAPI
          # half (the bundle imports, boots, serves /healthz). It does NOT
          # touch pywebview — by design — so it doesn't fire `import clr`
          # and missed v0.5.3/v0.5.4's missing-pythonnet-companions bug.
          # --check-windows-runtime covers exactly that gap: it forces
          # `import clr` (pythonnet → clr_loader → netfx) and imports the
          # edgechromium backend module. No window opens, no display
          # required — only the .NET loader chain is exercised. If the
          # bundle is missing Python.Runtime.dll.config / runtimeconfig.json
          # / clr_loader's clr.dll shim, this step fails fast at build time
          # instead of at end-user launch.
          $hz = Start-Process -FilePath ".\dist\gamepile\gamepile.exe" `
              -ArgumentList "--healthz-only" -Wait -PassThru -NoNewWindow
          if ($hz.ExitCode -ne 0) {
            Write-Host "--healthz-only FAILED — exit code $($hz.ExitCode)"
            exit 1
          }
          Write-Host "--healthz-only PASSED"

          $rt = Start-Process -FilePath ".\dist\gamepile\gamepile.exe" `
              -ArgumentList "--check-windows-runtime" -Wait -PassThru -NoNewWindow
          if ($rt.ExitCode -ne 0) {
            Write-Host "--check-windows-runtime FAILED — exit code $($rt.ExitCode)"
            exit 1
          }
          Write-Host "--check-windows-runtime PASSED"
          Write-Host "Smoke test PASSED (both stages)"
          exit 0

      # README.bundled.md ships inside each archive as README.md — gives
      # users the install / first-run / troubleshooting docs without
      # needing to visit GitHub.
      - name: Stage bundled README (Linux)
        if: matrix.platform_label == 'linux'
        run: cp README.bundled.md dist/gamepile/README.md

      - name: Stage bundled README (Windows)
        if: matrix.platform_label == 'windows'
        shell: pwsh
        run: Copy-Item README.bundled.md dist\gamepile\README.md

      - name: Archive bundle (Linux)
        if: matrix.platform_label == 'linux'
        run: |
          cd dist
          tar -czf "../gamepile-${{ github.ref_name }}-linux-x64.tar.gz" gamepile

      - name: Archive bundle (Windows)
        if: matrix.platform_label == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\gamepile -DestinationPath "gamepile-${{ github.ref_name }}-windows-x64.zip"

      # Tag pushes publish a Release directly. The earlier design routed
      # tag pushes to a draft Release for manual promotion, on the theory
      # that the author should control when releases go public. In
      # practice the manual-promote step was never taken, so "user
      # controls when releases go public" became "releases never go
      # public" — strictly worse for a friend-distribution project.
      # Direct publish wins.
      # Manual workflow_dispatch runs still upload to the Actions run
      # page only — keeps the Releases list clean during iteration.
      - name: Publish Release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            gamepile-${{ github.ref_name }}-linux-x64.tar.gz
            gamepile-${{ github.ref_name }}-windows-x64.zip
          fail_on_unmatched_files: false
          generate_release_notes: true

      - name: Upload bundle as workflow artifact (dispatch runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gamepile-${{ matrix.platform_label }}-${{ github.sha }}
          path: |
            gamepile-*-linux-x64.tar.gz
            gamepile-*-windows-x64.zip
          if-no-files-found: ignore
          retention-days: 14
