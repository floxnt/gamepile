<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GamePile{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header>
    <nav>
      {% if request.url.path.startswith("/games/") %}
        <button class="nav-back" aria-label="Back" onclick="history.length>1?history.back():location='/library'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      {% endif %}
      <a href="/" class="nav-brand">GamePile</a>
      <div class="nav-links">
        <a href="/" {% if request.url.path == "/" %}class="active"{% endif %}>Shortlist</a>
        <a href="/backlog" {% if request.url.path.startswith("/backlog") %}class="active"{% endif %}>Backlog</a>
        <a href="/library" {% if request.url.path == "/library" %}class="active"{% endif %}>Library</a>
        <a href="/dashboard" {% if request.url.path.startswith("/dashboard") %}class="active"{% endif %}>Dashboard</a>
      </div>
      <div class="refresh-btn-group">
        <button
          hx-post="/refresh"
          hx-target="#refresh-status"
          hx-swap="innerHTML"
          class="btn btn-secondary btn-sm"
        >Refresh Library</button>
        <button
          hx-post="/refresh?force=true"
          hx-target="#refresh-status"
          hx-swap="innerHTML"
          class="btn btn-ghost btn-sm"
          title="Bypass HLTB cache — re-fetches everything"
        >Force</button>
        <a href="/settings"
           class="nav-settings-link {% if request.url.path == '/settings' %}active{% endif %}"
           title="Manage credentials">Settings</a>
      </div>
    </nav>
  </header>

  <div id="refresh-status"></div>

  <main>
    <div class="page-wrap {% block wrap_class %}{% endblock %}">
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
